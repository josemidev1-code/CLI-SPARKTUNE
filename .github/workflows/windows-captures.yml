name: SparkTune Windows capture
on:
  push:
    branches: [codex/windows-captures]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify setup profile behavior
        shell: powershell
        run: ./tests/setup-tests.ps1
      - name: Validate setup plan files
        shell: powershell
        run: ./tests/plan-tests.ps1
      - name: Run and record SparkTune
        shell: powershell
        run: ./tests/windows-demo.ps1 -OutputDirectory "$env:RUNNER_TEMP/sparktune-captures"
      - name: Save Windows transcripts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparktune-windows-evidence
          path: ${{ runner.temp }}/sparktune-captures
          if-no-files-found: error
          retention-days: 14

  ascii-intro:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pywinpty pyte
      - run: python tests/record-banner.py banner-frames.json
      - uses: actions/upload-artifact@v4
        with:
          name: sparktune-ascii-intro
          path: banner-frames.json

  portable-contract:
    name: Portable contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check catalog metadata
        shell: pwsh
        run: ./tests/run-tests.ps1
      - name: Check public read-only commands
        shell: pwsh
        run: |
          ./sparktune.ps1 validar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actions = ./sparktune.ps1 acciones --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($actions).Count -ne 5) { throw 'Expected five catalog actions.' }
      - name: Validate setup plan files
        shell: pwsh
        run: ./tests/plan-tests.ps1
      - name: Check journal files
        shell: pwsh
        run: ./tests/journal-tests.ps1
