name: SparkTune Python
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - run: uv run --locked pytest -q
      - run: uv build
      - name: Instalar y usar el wheel fuera del repositorio
        run: uv run --locked python scripts/probar_wheel.py
