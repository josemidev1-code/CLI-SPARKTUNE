name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract tests (metadatos, sin aplicar nada)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run contract tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/run-tests.ps1

  dryrun:
    name: Dry-run wizard (todos los perfiles x niveles)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run each profile/level
        shell: powershell
        run: |
          $profiles = 'gaming','ofimatica','limpieza','bajos-recursos','portatil-ahorro','portatil-rendimiento','red-privacidad','creativo','desarrollo','personalizado'
          $levels = 'suave','medio','agresivo'
          foreach ($p in $profiles) {
            foreach ($l in $levels) {
              Write-Host "=== $p / $l ==="
              # stdin vacio: los Read-Host reciben EOF y el wizard aborta antes de aplicar (proteccion doble con --dry-run)
              '' | powershell -NoProfile -ExecutionPolicy Bypass -File ./sparktune.ps1 --perfil=$p --nivel=$l --dry-run --no-banner
              if ($LASTEXITCODE -gt 1) { throw "dry-run fallo para $p/$l (exit $LASTEXITCODE)" }
            }
          }
          Write-Host 'dry-runs OK'

  installer:
    name: install.ps1 smoke (PS 5.1, user scope)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from standalone script (PS 5.1)
        shell: powershell
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'SparkTune standalone'
          New-Item -ItemType Directory -Path $temp | Out-Null
          $script = Join-Path $temp 'install.ps1'
          Copy-Item -LiteralPath ./install.ps1 -Destination $script
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { throw "standalone install exit $LASTEXITCODE" }

          $dst = Join-Path $env:LOCALAPPDATA 'SparkTune'
          $userPath = (Get-ItemProperty 'HKCU:\Environment' -Name Path).Path
          if (($userPath -split ';') -notcontains $dst) { throw 'falta SparkTune en PATH de usuario' }
          & "$dst\sparktune.cmd" --help --no-banner
          if ($LASTEXITCODE -ne 0) { throw "sparktune.cmd --help exit $LASTEXITCODE" }

      - name: Update, repair, reinstall and reject incomplete source (PS 5.1)
        shell: powershell
        run: |
          $dst = Join-Path $env:LOCALAPPDATA 'SparkTune'
          $versionFile = Join-Path $dst 'VERSION.txt'
          $expected = (Select-String -Path ./src/core/globals.ps1 -Pattern "STVersion = '(\d+\.\d+\.\d+)'").Matches[0].Groups[1].Value
          $journal = Join-Path $env:USERPROFILE '.sparktune\journal.json'
          Add-Content -LiteralPath $journal -Value ''
          $journalHash = (Get-FileHash -LiteralPath $journal).Hash
          $marker = Join-Path $dst 'test-marker.txt'
          Set-Content -LiteralPath $versionFile -Value '0.0.0' -Encoding Ascii
          New-Item -ItemType File -Path $marker | Out-Null
          ./install.ps1
          if ($LASTEXITCODE -ne 0 -or (Get-Content -LiteralPath $versionFile) -ne $expected -or (Test-Path -LiteralPath $marker)) {
            throw 'no se sustituyo la version anterior'
          }

          New-Item -ItemType File -Path $marker | Out-Null
          $pathBefore = (Get-ItemProperty 'HKCU:\Environment' -Name Path).Path
          ./install.ps1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $marker)) { throw 'se reinstalo la misma version' }
          if ((Get-ItemProperty 'HKCU:\Environment' -Name Path).Path -ne $pathBefore) { throw 'cambio inesperado del PATH' }

          Remove-Item -LiteralPath "$dst\sparktune.cmd"
          ./install.ps1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "$dst\sparktune.cmd")) { throw 'no se reparo el lanzador' }

          New-Item -ItemType File -Path $marker | Out-Null
          ./install.ps1 -Force
          if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $marker)) { throw 'fallo la reinstalacion forzada' }

          $partial = Join-Path $env:RUNNER_TEMP 'SparkTune incomplete'
          New-Item -ItemType Directory -Path $partial | Out-Null
          Copy-Item -Path ./install.ps1, ./sparktune.ps1 -Destination $partial
          $script = Join-Path $partial 'install.ps1'
          $process = Start-Process powershell.exe -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', ('"' + $script + '"') -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -eq 0) { throw 'se acepto una copia incompleta' }

          & "$dst\sparktune.cmd" --help --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'la instalacion ya no funciona' }
          if ((Get-Content -LiteralPath $versionFile) -ne $expected) { throw 'cambio inesperado de version' }
          if ((Get-FileHash -LiteralPath $journal).Hash -ne $journalHash) { throw 'cambio inesperado del journal' }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$dst\uninstall.ps1"
          if ($LASTEXITCODE -ne 0 -or (Test-Path -LiteralPath $dst)) { throw 'fallo la desinstalacion' }
          $userPath = (Get-ItemProperty 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue).Path
          if (($userPath -split ';') -contains $dst) { throw 'la desinstalacion dejo SparkTune en PATH' }
          if ((Get-FileHash -LiteralPath $journal).Hash -ne $journalHash) { throw 'la desinstalacion cambio el journal' }
