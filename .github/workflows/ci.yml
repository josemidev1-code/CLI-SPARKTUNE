name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract tests (metadatos, sin aplicar nada)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run contract tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/run-tests.ps1

  dryrun:
    name: Dry-run wizard (todos los perfiles x niveles)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run each profile/level
        shell: powershell
        run: |
          $profiles = 'gaming','ofimatica','limpieza','bajos-recursos','portatil-ahorro','portatil-rendimiento','red-privacidad','creativo','desarrollo','personalizado'
          $levels = 'suave','medio','agresivo'
          foreach ($p in $profiles) {
            foreach ($l in $levels) {
              Write-Host "=== $p / $l ==="
              # stdin vacio: los Read-Host reciben EOF y el wizard aborta antes de aplicar (proteccion doble con --dry-run)
              '' | powershell -NoProfile -ExecutionPolicy Bypass -File ./sparktune.ps1 --perfil=$p --nivel=$l --dry-run --no-banner
              if ($LASTEXITCODE -gt 1) { throw "dry-run fallo para $p/$l (exit $LASTEXITCODE)" }
            }
          }
          Write-Host 'dry-runs OK'

  installer:
    name: install.ps1 smoke (PS 5.1, user scope)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, run, reinstall same version (PS 5.1)
        shell: powershell
        run: |
          ./install.ps1
          if (-not (Test-Path "$env:LOCALAPPDATA\SparkTune\sparktune.ps1")) { throw 'falta sparktune.ps1 instalado' }
          $v = (Get-Content "$env:LOCALAPPDATA\SparkTune\VERSION.txt" -First 1).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION.txt mal: $v" }
          & "$env:LOCALAPPDATA\SparkTune\sparktune.ps1" --help --no-banner | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "sparktune --help exit $LASTEXITCODE" }
          $prevEAP = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'   # exit 0 + mensaje "ya instalado" -> Stop lo convertia en error (PS 5.1)
          $out = @()
          ./install.ps1 | Tee-Object -Variable out | Out-Null
          $hay = ($out -join "`n") -match 'Ya instalado'
          ./install.ps1 -Force | Out-Null
          $ErrorActionPreference = $prevEAP
          if (-not $hay) { throw 'reinstall misma version no detectado' }
          if (-not (Test-Path "$env:LOCALAPPDATA\SparkTune\sparktune.ps1")) { throw 'force reinstall fallo' }
          Write-Host 'installer smoke OK'
