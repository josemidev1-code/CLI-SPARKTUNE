[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sparktune"
version = "2.1.1"
description = "Prepara tu equipo y organiza los archivos de tu entorno de trabajo."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = ["typer>=0.16,<1", "psutil>=6,<8"]

[project.scripts]
sparktune = "sparktune.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/sparktune"]

[tool.hatch.build.targets.wheel.force-include]
"acciones.json" = "sparktune/acciones.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
